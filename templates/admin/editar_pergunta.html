<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar questão</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><div class="wrap"><main><section class="painel"><h1>Editar questão {{pergunta.id}}</h1>
{% with ms=get_flashed_messages() %}{% for m in ms %}<p class="admin-mensagem">{{m}}</p>{% endfor %}{% endwith %}
<form method="post" enctype="multipart/form-data" class="form-entrada">
<div class="campo"><label>Área</label><select name="area">{% for x in ['LC','CH','CN','MT'] %}<option value="{{x}}" {% if pergunta.area==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="campo"><label>Tipo</label><select name="tipo"><option value="PRINCIPAL" {% if pergunta.tipo=='PRINCIPAL' %}selected{% endif %}>Principal</option><option value="RESERVA" {% if pergunta.tipo=='RESERVA' %}selected{% endif %}>Reserva/desempate</option></select></div>
<div class="campo"><label>Ordem</label><input type="number" min="1" name="ordem" value="{{pergunta.ordem}}"></div><div class="campo"><label><input type="checkbox" name="ativa" value="1" {% if pergunta.ativa %}checked{% endif %}> Ativa</label></div>
<div class="campo"><label>Enunciado</label><textarea name="enunciado" rows="6" required>{{pergunta.enunciado}}</textarea></div>
{% if pergunta.imagem %}<p><img src="{{url_for('static',filename=pergunta.imagem)}}" style="max-width:400px"></p>{% endif %}<div class="campo"><label>Substituir/adicionar imagem</label><input type="file" name="imagem" accept="image/png,image/jpeg,image/webp"></div>
{% for l in ['a','b','c','d','e'] %}<div class="campo"><label>Alternativa {{l|upper}}</label><input name="alternativa_{{l}}" value="{{pergunta['alternativa_'+l]}}" required></div>{% endfor %}
<div class="campo"><label>Correta</label><select name="alternativa_correta">{% for x in ['A','B','C','D','E'] %}<option value="{{x}}" {% if pergunta.alternativa_correta==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><button class="btn">Salvar</button> <a class="btn ranking-btn-secundario" href="{{url_for('admin.perguntas')}}">Cancelar</a></form></section></main></div></body></html>
