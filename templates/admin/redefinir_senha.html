<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><script src="{{url_for('static',filename='js/senha.js')}}" defer></script></head><body><div class="wrap"><main><section class="painel admin-form-card"><span class="dupla-numero">Dupla #{{dupla.id}}</span><h1>Redefinir senha</h1><p>{{dupla.participante_1}} + {{dupla.participante_2}}</p>{% with ms=get_flashed_messages() %}{% for m in ms %}<p class="admin-mensagem">{{m}}</p>{% endfor %}{% endwith %}<form method="post" class="form-entrada"><div class="campo"><label>Nova senha</label><div class="senha-wrap"><input type="password" id="nova-senha" name="senha" minlength="6" required><button type="button" class="senha-toggle" data-password-toggle="nova-senha">Exibir</button></div></div><div class="campo"><label>Confirmar nova senha</label><div class="senha-wrap"><input type="password" id="confirmar-senha" name="confirmar_senha" minlength="6" required><button type="button" class="senha-toggle" data-password-toggle="confirmar-senha">Exibir</button></div></div><button class="btn">Redefinir senha</button><a href="{{url_for('admin.duplas')}}">Cancelar</a></form></section></main></div></body></html>
