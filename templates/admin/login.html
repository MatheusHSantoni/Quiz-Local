<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Admin - Maratona Enem</title>
</head>
<body>

    <h1>Login administrativo</h1>

    <form method="post">

        <label for="usuario"> Usuário </label>

        <input
            id="usuario"
            name="usuario"
            type="text"
            required>

        <label for="senha"> Senha </label>

        <input
            id="senha"
            name="senha"
            type="password"
            required>

        <button type="submit"> Entrar </button>

    </form>
</body>
</html>
