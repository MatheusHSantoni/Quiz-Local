<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Maratona ENEM</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><script src="{{url_for('static',filename='js/senha.js')}}" defer></script></head><body class="entrada-page"><header class="topo"><img src="{{url_for('static',filename='img/estudo-play.png')}}" alt="Estudo Play" class="logo"></header><main class="admin-login-shell"><section class="painel admin-login-card"><span class="ao-vivo">Área restrita</span><h1>Painel administrativo</h1><p class="sub">Gerencie questões, duplas, etapas e ranking.</p>{% with ms=get_flashed_messages() %}{% for m in ms %}<p class="admin-mensagem">{{m}}</p>{% endfor %}{% endwith %}<form method="post" class="form-entrada"><div class="campo"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" required autofocus></div><div class="campo"><label for="admin-senha">Senha</label><div class="senha-wrap"><input id="admin-senha" name="senha" type="password" autocomplete="current-password" required><button type="button" class="senha-toggle" data-password-toggle="admin-senha">Exibir</button></div></div><button class="btn entrada-btn">Entrar no painel</button></form></section></main></body></html>
