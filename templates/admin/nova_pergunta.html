<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova questão</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><div class="wrap"><main><section class="painel"><h1>Nova questão</h1>
{% with ms=get_flashed_messages() %}{% for m in ms %}<p class="admin-mensagem">{{m}}</p>{% endfor %}{% endwith %}
<form method="post" enctype="multipart/form-data" class="form-entrada">
<div class="campo"><label>Área</label><select name="area" required>{% for x in ['LC','CH','CN','MT'] %}<option value="{{x}}" {% if dados and dados.area==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="campo"><label>Tipo</label><select name="tipo" required><option value="PRINCIPAL">Principal</option><option value="RESERVA">Reserva/desempate</option></select></div>
<input type="hidden" name="ordem" value="1">
<p class="admin-ajuda">A ordem será definida automaticamente dentro da área. Questões principais entram ativas; questões de reserva ficam aguardando liberação.</p>
<div class="campo"><label>Enunciado</label><textarea name="enunciado" rows="6" required>{{dados.enunciado if dados else ''}}</textarea></div>
<div class="campo"><label>Imagem (opcional)</label><input type="file" name="imagem" accept="image/png,image/jpeg,image/webp"></div>
{% for l in ['a','b','c','d','e'] %}<div class="campo"><label>Alternativa {{l|upper}}</label><input name="alternativa_{{l}}" value="{{dados['alternativa_'+l] if dados else ''}}" required></div>{% endfor %}
<div class="campo"><label>Alternativa correta</label><select name="alternativa_correta" required>{% for x in ['A','B','C','D','E'] %}<option value="{{x}}">{{x}}</option>{% endfor %}</select></div>
<button class="btn">Cadastrar</button> <a class="btn ranking-btn-secundario" href="{{url_for('admin.perguntas')}}">Cancelar</a></form></section></main></div></body></html>
