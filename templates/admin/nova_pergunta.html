<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title> Nova pergunta - Admin </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" >
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrap">

    <header class="topo">

        <a class="lockup" href="{{ url_for('admin.dashboard') }}">
            <span class="l1">MARATONA </span> 
            <span class="l2">ENEM </span>
        </a>

        <img class="ep"src="{{ url_for('static', filename='img/estudo-play.png') }}" alt="Estudo Play">

    </header>

    <main>

        <section class="painel">
            <h1> Nova pergunta </h1>
            <p> Cadastre uma questão que será exibida durante o quiz. </p>

            {% with mensagens = get_flashed_messages() %}

                {% if mensagens %}
                    {% for mensagem in mensagens %}
                        <p>{{ mensagem }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" class="form-entrada">

                <div class="campo">
                    <label for="enunciado"> Enunciado </label>
                    <textarea
                        id="enunciado"
                        name="enunciado"
                        rows="5"
                        required
                    ></textarea>
                </div>


                <div class="campo">
                    <label for="alternativa_a"> Alternativa A </label>
                    <input
                        id="alternativa_a"
                        name="alternativa_a"
                        type="text"
                        required >
                </div>


                <div class="campo">
                    <label for="alternativa_b"> Alternativa B </label>
                    <input
                        id="alternativa_b"
                        name="alternativa_b"
                        type="text"
                        required >
                </div>


                <div class="campo">
                    <label for="alternativa_c"> Alternativa C </label>
                    <input
                        id="alternativa_c"
                        name="alternativa_c"
                        type="text"
                        required >
                </div>

                <div class="campo">
                    <label for="alternativa_d"> Alternativa D </label>
                    <input
                        id="alternativa_d"
                        name="alternativa_d"
                        type="text"
                        required>
                </div>

                <div class="campo">
                    <label for="alternativa_e"> Alternativa E </label>
                    <input
                        id="alternativa_e"
                        name="alternativa_e"
                        type="text"
                        required > 
                </div>

                <div class="campo">
                    <label for="alternativa_correta"> Alternativa correta </label>
                    <select
                        id="alternativa_correta"
                        name="alternativa_correta"
                        required>
                        <option value=""> Selecione </option>
                         <option value="A"> A </option>
                        <option value="B"> B </option>
                        <option value="C"> C </option>
                        <option value="D"> D </option>
                        <option value="E"> E </option>
                    </select>
                </div>

                <button class="btn" type="submit"> Cadastrar pergunta </button>
            </form>
            <p>
              <a href="{{ url_for('admin.dashboard') }}"> Voltar ao painel</a>
            </p>

        </section>

    </main>

    <footer class="rodape">Painel administrativo · Maratona Enem</footer>

</div>
</body>
</html>
