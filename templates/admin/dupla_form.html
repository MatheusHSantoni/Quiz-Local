<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{'Editar' if dupla else 'Nova'}} dupla</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><script src="{{url_for('static',filename='js/senha.js')}}" defer></script></head><body><div class="wrap"><main><section class="painel admin-form-card"><h1>{{'Editar participantes' if dupla else 'Nova dupla'}}</h1>{% if dupla %}<p class="admin-meta">Dupla #{{dupla.id}} · a senha é gerenciada separadamente.</p>{% endif %}{% with ms=get_flashed_messages() %}{% for m in ms %}<p class="admin-mensagem">{{m}}</p>{% endfor %}{% endwith %}<form method="post" class="form-entrada"><div class="campo"><label>Participante 1</label><input name="participante_1" value="{{dupla.participante_1 if dupla else ''}}" required></div><div class="campo"><label>Participante 2</label><input name="participante_2" value="{{dupla.participante_2 if dupla else ''}}" required></div>{% if not dupla %}<div class="campo"><label>Senha</label><div class="senha-wrap"><input type="password" name="senha" id="senha" minlength="6" required><button type="button" class="senha-toggle" data-password-toggle="senha" aria-label="Exibir senha">Exibir</button></div></div>{% endif %}<button class="btn">Salvar</button><a href="{{url_for('admin.duplas')}}">Cancelar</a></form></section></main></div></body></html>
