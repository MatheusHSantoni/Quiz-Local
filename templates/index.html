<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz em Duplas</title>

    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
    <script src="{{ url_for('static',filename='js/senha.js') }}" defer></script>
</head>

<body class="entrada-page">

    <header class="topo">
        <img src="{{ url_for('static',filename='img/estudo-play.png') }}" alt="Estudo Play" class="logo"> 
    </header>

    <main class="entrada">
        <section class="entrada-texto">
            <div class="entrada-apresentacao">
                <div class="entrada-conteudo">

                    <span class="ao-vivo">Quiz em Duplas</span>

                    <h1>
                        <span class="lar">Prepare sua</span>
                        <span class="rox">dupla!</span>
                    </h1>
                    <p class="sub"> Cadastre os participantes, crie sua senha e comece o desafio. </p>
                </div>

                <div class="entrada-personagem">
                    <div class="entrada-forma"></div>
                    <img src="{{ url_for('static',filename='img/aluno.png') }}" alt="" class="entrada-aluno"></div>
            </div>
        </section>

        <section class="painel entrada-card">

            <h2>Criar nova dupla</h2>

            <form
                class="form-entrada"
                action="{{ url_for('participantes.entrar') }}"
                method="POST">

                <div class="campo">

                    <label for="participante_1">Participante 1</label>

                    <input
                        type="text"
                        id="participante_1"
                        name="participante_1"
                        placeholder="Digite o nome"
                        autocomplete="name"
                        required>
                </div>

                <div class="campo">

                    <label for="participante_2">Participante 2 </label>

                    <input
                        type="text"
                        id="participante_2"
                        name="participante_2"
                        placeholder="Digite o nome"
                        autocomplete="name"
                        required>
                </div>

                <div class="campo">
                    <label for="senha"> Senha </label>

                    <div class="senha-wrap">
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        autocomplete="new-password"
                        required>
                    <button type="button" class="senha-toggle" data-password-toggle="senha">Exibir</button>
                    </div>
                </div>

                <button class="btn entrada-btn"
                    type="submit"> Criar time 
                </button>

            </form>

            <div class="entrada-existente">
                <p class="sub"> Já possui um time cadastrado?</p>
                <a class="btn entrada-btn" href="{{ url_for('participantes.login_time') }}"> Entrar no meu time </a>
            </div>
        </section>
    </main>
</body>
</html>
