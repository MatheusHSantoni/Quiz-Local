<h1>Quiz</h1>

<p>Dupla: {{ nome_dupla }}</p>
<p>ID: {{ dupla_id }}</p>

<p>{{ pergunta[1] }}</p>

<form action="/responder" method="post">
<input type="hidden" name="dupla_id" value="{{ dupla_id }}">
<input type="hidden" name="pergunta_id" value="{{ pergunta[0] }}">

<label>
    <input type="radio" name="alternativa" value="A" required>
    A) {{ pergunta[2] }}
</label>

<label>
    <input type="radio" name="alternativa" value="B">
    B) {{ pergunta[3] }}
</label>

<label>
    <input type="radio" name="alternativa" value="C">
    C) {{ pergunta[4] }}
</label>

<label>
    <input type="radio" name="alternativa" value="D">
    D) {{ pergunta[5] }}
</label>

<button type="submit">Responder</button>

</form>

<p>A) {{ pergunta[2] }}</p>
<p>B) {{ pergunta[3] }}</p>
<p>C) {{ pergunta[4] }}</p>
<p>D) {{ pergunta[5] }}</p>
